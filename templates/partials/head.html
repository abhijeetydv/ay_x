{{define "head"}}
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{if .PageTitle}}{{.PageTitle}}{{else}}{{.Site.Title}}{{end}}</title>
    <meta name="description" content="{{.PageDescription}}">
    <link rel="canonical" href="{{.CanonicalURL}}">
    {{if .Site.ThemeColor}}<meta name="theme-color" content="{{.Site.ThemeColor}}">{{end}}
    <link rel="icon"{{if .FaviconType}} type="{{.FaviconType}}"{{end}} href="{{.Site.Favicon}}">
    <meta property="og:type" content="website">
    <meta property="og:site_name" content="{{.Site.Name}}">
    <meta property="og:title" content="{{if .PageTitle}}{{.PageTitle}}{{else}}{{.Site.Title}}{{end}}">
    <meta property="og:description" content="{{.PageDescription}}">
    <meta property="og:url" content="{{.CanonicalURL}}">
    <meta property="og:image" content="{{.OGImageURL}}">
    <meta property="og:image:alt" content="{{.Site.OGImageAlt}}">
    <meta property="og:locale" content="{{.Site.Locale}}">
    <meta name="twitter:card" content="summary_large_image">
    <meta name="twitter:title" content="{{if .PageTitle}}{{.PageTitle}}{{else}}{{.Site.Title}}{{end}}">
    <meta name="twitter:description" content="{{.PageDescription}}">
    <meta name="twitter:image" content="{{.OGImageURL}}">
    <meta name="twitter:image:alt" content="{{.Site.OGImageAlt}}">
    <link rel="stylesheet" href="styles.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant:ital,wght@0,300..700;1,300..700&family=JetBrains+Mono:wght@300;400;500;600;700&family=Titillium+Web:ital,wght@0,200;0,300;0,400;0,600;0,700;0,900;1,200;1,300;1,400;1,600;1,700&display=swap" rel="stylesheet">
</head>
{{end}}
